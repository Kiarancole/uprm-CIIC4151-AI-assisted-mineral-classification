[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uprm-mineral-classification"
version = "0.1.0"
description = "Shared training and evaluation pipeline for the UPRM mineral classification capstone"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.66"
]

[tool.setuptools.packages.find]
where = ["src"]

